# Alembic configuration for developers. The app applies migrations automatically at start-up.
[alembic]
script_location = mdos/migrations
file_template = %%(rev)s_%%(slug)s
# Overridden by DATABASE_URL when set; defaults to a local SQLite file for autogenerate.
sqlalchemy.url = sqlite:///./dev-migrations.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
