[project]
name = "mdos"
version = "0.1.0"
description = "Marketing Decision OS: agentic marketing research, strategy simulation and customer journey design"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "openpyxl>=3.1",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "email-validator>=2.1",
    "defusedxml>=0.7",
    "anthropic>=1.9",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6"]
desktop = ["pyinstaller>=6.6"]

[project.scripts]
mdos = "mdos.desktop:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mdos*"]

[tool.setuptools.package-data]
mdos = ["static/**/*", "migrations/**/*", "alembic.ini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:statsmodels.*",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
    "S101",  # assert is fine in tests
    "E501",  # long lines are handled by the formatter where it matters
    "B008",  # FastAPI Depends in defaults
    "S311",  # random is used for simulation, not security
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
