name: Project page

# Publishes GitHub Pages (https://<owner>.github.io/MDOS/): the project page in site/ and, under demo/, the live
# demo, which is the full app running in the visitor's browser (Pyodide; see scripts/build_demo.py). Nothing on the
# site loads from other domains. Until Pages is set to publish from GitHub Actions (Settings, Pages, Source), the
# site is built and tested but not deployed.
on:
  workflow_dispatch:
  push:
    branches: [main, claude/mdos-analysis-he0sf5]
    paths:
      - "site/**"
      - "docs/assets/**"
      - "frontend/**"
      - "backend/mdos/**"
      - "backend/requirements.txt"
      - "samples/**"
      - "scripts/build_demo.py"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the live demo
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run build:demo
          python ../scripts/build_demo.py --cache "$RUNNER_TEMP/pyodide"
      - name: Test the live demo in Chromium
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npx playwright test -c playwright.demo.config.ts
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-playwright-report
          path: |
            frontend/playwright-report-demo
            frontend/test-results-demo
          retention-days: 7
      - name: Assemble
        run: |
          mkdir -p _site/assets
          cp -R site/. _site/
          cp docs/assets/*.svg docs/assets/*.png _site/assets/
          cp -R frontend/dist-demo _site/demo
          # Every link must be https: refuse the build if a plain http link slipped in.
          if grep -nE '(href|src|srcset|content)="http://' _site/*.html _site/demo/*.html; then exit 1; fi
      - name: Check that GitHub Pages publishes from Actions
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          build_type=$(gh api "repos/$REPO/pages" --jq .build_type 2>/dev/null || true)
          if [ "$build_type" = workflow ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages is not publishing from Actions::The page was built but not published. Open Settings, Pages and set Source to GitHub Actions, then run this workflow again."
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
