name: Project page

# Publishes the static project page in site/ to GitHub Pages (https://<owner>.github.io/MDOS/). The page has no
# scripts and loads nothing from other sites; the screenshots and logos are copied from docs/assets. Until Pages is
# set to publish from GitHub Actions (Settings, Pages, Source), the page is built and checked but not deployed.
on:
  workflow_dispatch:
  push:
    branches: [main, claude/mdos-analysis-he0sf5]
    paths: ["site/**", "docs/assets/**", ".github/workflows/pages.yml"]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assemble
        run: |
          mkdir -p _site/assets
          cp -R site/. _site/
          cp docs/assets/*.svg docs/assets/*.png _site/assets/
          # Every link must be https: refuse the build if a plain http link slipped in.
          if grep -nE '(href|src|srcset|content)="http://' _site/*.html; then exit 1; fi
      - name: Check that GitHub Pages publishes from Actions
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          build_type=$(gh api "repos/$REPO/pages" --jq .build_type 2>/dev/null || true)
          if [ "$build_type" = workflow ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages is not publishing from Actions::The page was built but not published. Open Settings, Pages and set Source to GitHub Actions, then run this workflow again."
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
