name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

# Least privilege: jobs can read the code and nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to full commit hashes (the comment names the release). Dependabot updates them.
jobs:
  backend:
    name: Backend (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mdos
          POSTGRES_PASSWORD: mdos
          POSTGRES_DB: mdos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mdos -d mdos_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install (exact, hash-checked runtime dependencies, then test tools)
        run: |
          pip install --require-hashes -r requirements.txt
          pip install -e ".[dev]"
      - name: Lint
        if: matrix.database == 'sqlite'
        run: ruff check mdos tests
      - name: Tests
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://mdos:mdos@localhost:5432/mdos_test' || '' }}
        run: pytest -q
      - name: Migrations match the models
        if: matrix.database == 'sqlite'
        run: |
          alembic -c alembic.ini upgrade head
          alembic -c alembic.ini check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  security:
    name: Secrets and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: No credentials in tracked files
        run: python scripts/check_secrets.py
      - name: Python dependencies have no known vulnerabilities
        run: |
          pip install "pip-audit==2.10.1"
          pip-audit -r backend/requirements.txt --require-hashes --disable-pip --progress-spinner off
      - name: npm dependencies have no known vulnerabilities
        working-directory: frontend
        run: |
          npm audit --omit=dev --audit-level=moderate
          npm audit --audit-level=high

  e2e:
    name: End-to-end (Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: |
          pip install --require-hashes -r backend/requirements.txt
          pip install -e "backend[dev]"
      - working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run build
          npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  docker:
    name: Docker image
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t mdos:ci .
      - name: Smoke test (cloud mode, read-only root filesystem, SQLite in the data volume)
        run: |
          docker run -d --name mdos -p 127.0.0.1:8000:8000 --read-only --tmpfs /tmp \
            --security-opt no-new-privileges:true --cap-drop ALL \
            -e SECRET_KEY="$(openssl rand -base64 48)" mdos:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 2; done
          curl -sf http://127.0.0.1:8000/api/health
          curl -sf http://127.0.0.1:8000/ | grep -q "<div id=\"root\">"
          curl -sfI http://127.0.0.1:8000/ | grep -qi "content-security-policy: default-src 'self'"
      - if: always()
        run: docker logs mdos || true
