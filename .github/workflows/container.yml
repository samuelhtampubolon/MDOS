name: Container image

# Publishes the cloud image to GitHub Container Registry (ghcr.io/<owner>/mdos) for version tags and manual
# runs, after the same smoke test CI runs. Hosts that run a ready-made image (Hugging Face Spaces, Render, Koyeb,
# Fly.io) pull it from there; see deploy/README.md.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build, test and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build -t mdos:candidate .
      - name: Smoke test (cloud mode, read-only root filesystem)
        run: |
          docker run -d --name mdos -p 127.0.0.1:8000:8000 --read-only --tmpfs /tmp \
            --security-opt no-new-privileges:true --cap-drop ALL \
            -e SECRET_KEY="$(openssl rand -base64 48)" mdos:candidate
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 2; done
          curl -sf http://127.0.0.1:8000/api/health
          curl -sfI http://127.0.0.1:8000/ | grep -qi "content-security-policy: default-src 'self'"
          docker rm -f mdos
      - name: Publish
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          image="ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/mdos"
          if [ "$REF_TYPE" = "tag" ]; then tags="${REF_NAME#v} latest"; else tags="edge"; fi
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          for tag in $tags; do
            docker tag mdos:candidate "$image:$tag"
            docker push "$image:$tag"
          done
          docker logout ghcr.io
