name: Desktop build

# Builds the desktop app for Windows, macOS and Linux. Runs from the Actions tab, on a tag like v0.1.0,
# and on branch pushes that change the packaging.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [main, "claude/**"]
    paths:
      - "packaging/**"
      - "scripts/build_desktop.py"
      - "backend/pyproject.toml"
      - "backend/requirements.txt"
      - "backend/mdos/desktop.py"
      - "backend/mdos/main.py"
      - "backend/mdos/config.py"
      - "backend/mdos/security.py"
      - "backend/mdos/migrations_runner.py"
      - "backend/mdos/migrations/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install (exact, hash-checked dependencies, then the packager)
        run: |
          pip install --require-hashes -r backend/requirements.txt
          pip install -e "backend[desktop]"
      - run: python scripts/build_desktop.py
      - name: Smoke test the executable (private launch key, session cookie, demo project)
        shell: bash
        run: |
          EXE=dist/MDOS/MDOS
          [ -f dist/MDOS/MDOS.exe ] && EXE=dist/MDOS/MDOS.exe
          export MDOS_LOCAL_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$MDOS_LOCAL_KEY"  # the launcher prints its private link; keep the key out of public logs
          "$EXE" --no-browser --strict-port --port 8765 --data-dir "$RUNNER_TEMP/mdos-data" &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8765/api/health && break; sleep 2; done
          curl -sf http://127.0.0.1:8765/api/health
          H=(-H "X-Requested-With: mdos" -H "Content-Type: application/json")
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "${H[@]}" -d '{"key":"wrong"}' \
            http://127.0.0.1:8765/api/v1/auth/local-session)" = "401"
          curl -sf -c "$RUNNER_TEMP/jar" -X POST "${H[@]}" -d "{\"key\":\"$MDOS_LOCAL_KEY\"}" \
            http://127.0.0.1:8765/api/v1/auth/local-session > /dev/null
          curl -sf -b "$RUNNER_TEMP/jar" -X POST "${H[@]}" -d '{}' http://127.0.0.1:8765/api/v1/projects/demo | grep -q '"id"'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MDOS-${{ runner.os }}
          path: dist/MDOS-*.zip
          retention-days: 30
